<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bookmarker - save your favorite sites</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bookmarker - save your favorite sites" />
    <meta property="og:description" content="Save, visit and delete your favorite sites, stored in your browser with localStorage." />
    <meta property="og:url" content="https://malakmo7amed309.github.io/bookmarker/" />
    <meta property="og:image" content="https://malakmo7amed309.github.io/bookmarker/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bookmarker - save your favorite sites" />
    <meta name="twitter:description" content="Save, visit and delete your favorite sites, stored in your browser with localStorage." />
    <meta name="twitter:image" content="https://malakmo7amed309.github.io/bookmarker/og-image.png" />

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>Bookmarker</h1>
    <p>Save the sites you come back to. Everything stays in this browser.</p>
  </div>
</header>
<main class="wrap">
  <form id="bookmarkForm" class="add" novalidate>
    <div class="field"><label for="siteName">Site name</label><input type="text" id="siteName" placeholder="e.g. MDN Web Docs" autocomplete="off"></div>
    <div class="field"><label for="siteUrl">Website URL</label><input type="text" id="siteUrl" placeholder="developer.mozilla.org" autocomplete="off" inputmode="url"></div>
    <div class="field"><label for="siteTag">Tag (optional)</label><input type="text" id="siteTag" placeholder="docs, jobs, tools" list="tagList" autocomplete="off"><datalist id="tagList"></datalist></div>
    <button id="submitBtn" type="submit" class="btn primary">Save bookmark</button>
    <button id="cancelBtn" type="button" class="btn ghost d-none">Cancel edit</button>
    <p id="formError" class="error d-none" role="alert"></p>
  </form>

  <section class="tools" aria-label="Find and manage bookmarks">
    <input type="search" id="search" placeholder="Search by name, URL or tag" aria-label="Search bookmarks">
    <select id="tagFilter" aria-label="Filter by tag"><option value="">All tags</option></select>
    <select id="sort" aria-label="Sort bookmarks">
      <option value="added">Newest first</option>
      <option value="name">Name A to Z</option>
      <option value="pinned">Pinned first</option>
    </select>
    <button id="exportBtn" class="btn ghost" type="button">Export</button>
    <button id="importBtn" class="btn ghost" type="button">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </section>

  <p id="count" class="count" aria-live="polite"></p>
  <ul id="list" class="grid"></ul>
  <p id="empty" class="empty d-none">No bookmarks yet. Add your first site above.</p>
</main>
<div id="toast" class="toast d-none" role="status"><span id="toastMsg"></span><button id="undoBtn" type="button">Undo</button></div>
<script src="main.js"></script>
</body>
</html>
